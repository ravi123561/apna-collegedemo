name: PureAgile Stage Pipeline Test

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      fail_stage:
        description: "Select which stage should fail"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - build
          - test
          - deploy

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build started
        run: echo "Build started"

      - name: Simulate build failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_stage == 'build' }}
        run: |
          echo "Build failed intentionally"
          exit 1

      - name: Build succeeded
        run: echo "Build succeeded"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint started
        run: echo "Running lint checks..."

      - name: Lint completed
        run: echo "Lint successful"

  security-scan:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Security scan started
        run: echo "Scanning for vulnerabilities..."

      - name: Sonar Scan
        run: echo "Running sonar scan..."

      - name: Security scan completed
        run: echo "No vulnerabilities found"

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test started
        run: echo "Test started"

      - name: Run Jest
        run: npm test -- --passWithNoTests

      - name: Simulate test failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_stage == 'test' }}
        run: |
          echo "Test failed intentionally"
          exit 1

      - name: Test succeeded
        run: echo "Test succeeded"

  deploy-dev:
    name: Deploy Dev
    needs:
      - test
      - security-scan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy started
        run: echo "Deploy dev started"

      - name: Simulate deploy failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_stage == 'deploy' }}
        run: |
          echo "Deploy failed intentionally"
          exit 1

      - name: Deploy succeeded
        run: echo "Deploy dev succeeded"
